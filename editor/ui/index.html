<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="brand-icon">🖥️</span>
    <span class="brand-name" id="brand-title">Site Editor</span>
  </div>

  <div id="save-area">
    <span id="save-status" class="status-chip">Loading…</span>
    <button id="btn-save" class="btn primary" title="Save (Ctrl+S)" disabled>💾 Save</button>
  </div>

  <div id="git-area">
    <span id="git-chip" class="status-chip muted" title="Git status">git: …</span>
    <button id="btn-commit" class="btn" title="Commit content.js and images" disabled>Commit…</button>
    <button id="btn-push" class="btn" title="git push" disabled>Push</button>
    <button id="btn-log" class="btn ghost" title="Show output log">Log</button>
  </div>
</header>

<main id="layout">

  <!-- ── Sidebar ─────────────────────────────────── -->
  <nav id="sidebar">
    <div class="side-search">
      <input id="search" type="search" placeholder="Search posts…  (/)" autocomplete="off">
    </div>

    <div class="side-section">
      <div class="side-head">
        <span>Posts</span>
        <button class="mini" id="btn-new-post" title="New post (Ctrl+N)">＋ New</button>
      </div>
      <div id="post-tree"></div>
    </div>

    <div class="side-section">
      <div class="side-head">
        <span>Folders</span>
        <button class="mini" id="btn-new-folder" title="New folder">＋</button>
      </div>
      <ul id="folder-list" class="side-list"></ul>
    </div>

    <div class="side-section">
      <div class="side-head">
        <span>Shortcuts</span>
        <button class="mini" id="btn-new-shortcut" title="New shortcut">＋</button>
      </div>
      <ul id="shortcut-list" class="side-list"></ul>
    </div>

    <div class="side-section">
      <ul class="side-list">
        <li><button class="side-item" data-sel="site">⚙️ Site &amp; social links</button></li>
        <li><button class="side-item" data-sel="images">🖼️ Image library</button></li>
      </ul>
    </div>
  </nav>

  <!-- ── Editor pane ─────────────────────────────── -->
  <section id="editor">
    <div id="editor-empty" class="empty">
      <div class="empty-icon">📄</div>
      <p>Select a post on the left, or <button class="link" id="empty-new">create a new one</button>.</p>
      <p class="hint">Shortcuts: <kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>N</kbd> new post · <kbd>/</kbd> search</p>
    </div>
    <div id="editor-body" hidden></div>
  </section>

  <!-- ── Preview pane ────────────────────────────── -->
  <section id="preview">
    <div class="preview-bar">
      <span class="preview-title">Live preview</span>
      <div class="seg">
        <button data-w="desktop" class="on" title="Desktop width">🖥️</button>
        <button data-w="mobile" title="Mobile width (600px)">📱</button>
      </div>
      <button class="mini" id="btn-preview-reload" title="Reload preview">↻</button>
      <a class="mini" id="preview-open" href="/site/" target="_blank" rel="noopener" title="Open site in a new tab">↗</a>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="preview-frame" src="/site/?preview=1" title="Site preview"></iframe>
    </div>
  </section>
</main>

<!-- Drag-over hint -->
<div id="drop-hint" hidden>Drop images to upload</div>

<!-- Toasts -->
<div id="toasts"></div>

<!-- Log drawer -->
<aside id="log-drawer" hidden>
  <div class="drawer-head"><span>Output</span><button class="mini" id="btn-log-close">✕</button></div>
  <pre id="log-out"></pre>
</aside>

<!-- Modal -->
<div id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><span id="modal-title"></span><button class="mini" id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
